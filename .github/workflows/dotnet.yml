name: .NET SCM Demo CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore
      run: dotnet restore StudentResultsApi.sln

    - name: Build
      run: dotnet build StudentResultsApi.sln --configuration Release --no-restore

    - name: Test
      run: dotnet test StudentResultsApi.Tests/StudentResultsApi.Tests.csproj --configuration Release --no-build
